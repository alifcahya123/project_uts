<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>SUPERLIGA ID</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="main-banner">
    <div class="banner-content">
      <h2>Liga 1 Champions 2020/2025</h2>
    </div>
  </div>
  
  <ion-grid class="ion-no-padding ion-margin-top ">
    <ion-row class="ion-justify-content-center ion-align-items-center">
      <ion-col size="3" class="ion-text-center ion-activatable relative" (click)="goToTeamList()">
        <ion-ripple-effect></ion-ripple-effect>
        <div class="menu-icon bg-blue">
          <ion-icon name="shield-half-outline"></ion-icon>
        </div>
        <ion-label>Tim</ion-label>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="section-header ion-margin-top">
    <h3>Klub Unggulan</h3>
  </div>
  
  <div class="horizontal-scroll-wrapper">
    <div class="team-card-container" *ngFor="let team of featuredTeams">
      <ion-card class="team-card" [routerLink]="['/team-detail', team.id]">
        <div class="logo-wrapper">
          <img [src]="team.logo" />
        </div>
        <ion-card-header>
          <ion-card-subtitle>{{ team.city }}</ion-card-subtitle>
          <ion-card-title>{{ team.name }}</ion-card-title>
        </ion-card-header>
      </ion-card>
    </div>
  </div>
  <div class="section-header ion-margin-top">
  <h3>Statistik Liga (5 Musim Terakhir)</h3>
</div>

<ion-grid>
  <ion-row>
    <ion-col size="6" *ngFor="let stat of statistikLiga">
      <ion-card class="stat-card ion-no-margin ion-margin-bottom">
        <ion-card-content class="ion-text-center">
          <div class="stat-icon-wrapper" [style.background-color]="'var(--ion-color-' + stat.color + '-tint)'">
            <ion-icon [name]="stat.icon" [color]="stat.color"></ion-icon>
          </div>
          <h4 class="stat-value">{{ stat.nilai }}</h4>
          <p class="stat-label">{{ stat.label }}</p>
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>
</ion-grid>

<div class="ion-text-center ion-padding-vertical" style="opacity: 0.5;">
  <small>Data Statistik Terverifikasi &copy; 2026</small>
</div>

</ion-content>
